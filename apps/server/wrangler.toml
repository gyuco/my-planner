# Config Cloudflare Worker per my-planner (porting CF, vedi BACKLOG.md).
# Worker unico che serve sia la REST API (Hono) sia MCP HTTP
# (WebStandardStreamableHTTPServerTransport, controparte Workers del
# transport Node usato da apps/server), con DB su D1 e allegati su R2.
name = "my-planner"
main = "src/cf/index.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# ---- Binding D1 (DB principale, sostituisce SQLite) -------------------------
[[d1_databases]]
binding = "DB"
database_name = "my-planner"
database_id = "93aac4dd-6211-47bc-82a9-5ba834539fdd"
migrations_dir = "migrations"

# ---- Binding R2 (storage allegati, sostituisce local/S3/MinIO) --------------
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "my-planner-attachments"

# ---- Var statiche ------------------------------------------------------------
# JWT_SECRET, BOOTSTRAP_USERNAME, BOOTSTRAP_PASSWORD, GMAIL_USER,
# GMAIL_APP_PASSWORD vanno impostate come secrets (`wrangler secret put`)
# o vars in produzione.
[vars]
MCP_HTTP_BASE_URL = "https://my-planner.giuseppe-concas.workers.dev"
STANDUP_RECIPIENT = "giuconcas@gmail.com"

# ---- Cron Trigger: standup giornaliero su tutti i progetti ------------------
# 06:00 UTC = 08:00 Italia in ora legale (CEST, mar-ott); in ora solare (CET,
# nov-mar) l'orario locale effettivo scala a 07:00 — Cloudflare valuta sempre
# in UTC, va aggiustato manualmente se serve l'orario locale esatto tutto l'anno.
[triggers]
crons = ["0 6 * * *"]