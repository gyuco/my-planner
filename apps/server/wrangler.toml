# Config Cloudflare Worker per my-planner (porting CF, vedi BACKLOG.md).
# Worker unico che serve sia la REST API (Hono) sia MCP HTTP
# (WebStandardStreamableHTTPServerTransport, controparte Workers del
# transport Node usato da apps/server), con DB su D1 e allegati su R2.
name = "my-planner"
main = "src/cf/index.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# ---- Workers Logs ------------------------------------------------------------
# console.log/warn del Worker consultabili dalla dashboard Cloudflare
# (Workers -> my-planner -> Logs), es. i token rifiutati su /mcp/global.
[observability]
enabled = true

# ---- Binding D1 (DB principale, sostituisce SQLite) -------------------------
[[d1_databases]]
binding = "DB"
database_name = "my-planner"
database_id = "93aac4dd-6211-47bc-82a9-5ba834539fdd"
migrations_dir = "migrations"

# ---- Binding R2 (storage allegati, sostituisce local/S3/MinIO) --------------
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "my-planner-attachments"

# ---- Durable Object: board in tempo reale ------------------------------------
# Un'istanza per progetto tiene i WebSocket (Hibernation API) dei client con la
# board aperta e inoltra gli avvisi di ogni modifica, da REST o da MCP
# (src/cf/realtime.ts). Classe SQLite: disponibile anche sul piano gratuito.
[[durable_objects.bindings]]
name = "PROJECT_REALTIME"
class_name = "ProjectRealtime"

[[migrations]]
tag = "v1-project-realtime"
new_sqlite_classes = ["ProjectRealtime"]

# ---- Workers AI + Vectorize -------------------------------------------------
# Ricerca semantica sui task e avviso di duplicati (embedding bge-m3 + indice
# Vectorize), trascrizione di note vocali (Whisper) e riassunto dello standup
# (LLM). Tutto rientra nella quota gratuita giornaliera di neuroni; senza
# questi binding le funzioni AI spariscono dalla UI.
# L'indice va creato una volta (1024 = dimensioni di @cf/baai/bge-m3), con
# l'indice di metadati per filtrare per progetto:
#   npx wrangler vectorize create my-planner-tasks --dimensions=1024 --metric=cosine
#   npx wrangler vectorize create-metadata-index my-planner-tasks --property-name=projectId --type=string
# poi, dopo il deploy, POST /admin/reindex-search indicizza i task esistenti.
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "my-planner-tasks"

# ---- Var statiche ------------------------------------------------------------
# JWT_SECRET, BOOTSTRAP_EMAIL, BOOTSTRAP_PASSWORD, GMAIL_USER,
# GMAIL_APP_PASSWORD (e opzionale SETTINGS_ENCRYPTION_KEY) vanno impostate come secrets (`wrangler secret put`)
# o vars in produzione.
[vars]
MCP_HTTP_BASE_URL = "https://my-planner.giuseppe-concas.workers.dev"
STANDUP_RECIPIENT = "giuconcas@gmail.com"

# ---- Cron Trigger: standup giornaliero su tutti i progetti ------------------
# 06:00 UTC = 08:00 Italia in ora legale (CEST, mar-ott); in ora solare (CET,
# nov-mar) l'orario locale effettivo scala a 07:00 — Cloudflare valuta sempre
# in UTC, va aggiustato manualmente se serve l'orario locale esatto tutto l'anno.
[triggers]
crons = ["0 6 * * *"]