# Serve la SPA React (build statica) e fa da reverse proxy verso il backend
# REST (apps/server) per le chiamate /api/*, coerente con la configurazione
# del proxy di Vite in sviluppo (apps/web/vite.config.ts).
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # SPA fallback: tutte le route client-side (react-router) risolvono su index.html
    location / {
        try_files $uri /index.html;
    }
}
