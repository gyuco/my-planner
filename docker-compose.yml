services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
      - "3100:3100"
    environment:
      - DATABASE_URL=file:/data/my-planner.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - PORT=3000
      - MCP_HTTP_PORT=3100
      - MCP_HTTP_BASE_URL=http://localhost:3100
      - BOOTSTRAP_USERNAME=${BOOTSTRAP_USERNAME:-admin}
      - BOOTSTRAP_PASSWORD=${BOOTSTRAP_PASSWORD:-admin-change-me}
      # Storage allegati: "local" (default) oppure "s3" (vedi config.example.md).
      # Puntato di default al servizio MinIO interno alla rete docker-compose,
      # utile per testare end-to-end il backend S3 (ATTACHMENTS_BACKEND=s3).
      - ATTACHMENTS_BACKEND=${ATTACHMENTS_BACKEND:-local}
      - ATTACHMENTS_LOCAL_DIR=/attachments/local
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-my-planner-attachments}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_REGION=${S3_REGION:-us-east-1}
    volumes:
      - ./data:/data
      - ./attachments:/attachments
    depends_on:
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server

  minio:
    # Le immagini ufficiali MinIO sono state rimosse da Docker Hub (set 2026)
    # e da quay.io (ott 2026). `pgsty/minio` è SILO, un fork drop-in
    # compatible (stesso binario, CLI `mc` inclusa) utile per sviluppo e test.
    # Tag pinnato per evitare aggiornamenti silenziosi dell'immagine.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ./data/minio:/data
    healthcheck:
      # L'immagine include curl; usiamo l'endpoint HTTP invece di `mc ready
      # local`, che richiederebbe un alias configurato nel container.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servizio one-shot che crea il bucket di test all'avvio (pattern comune per
  # MinIO in docker-compose, dato che l'immagine non espone un modo nativo per
  # creare bucket al boot). Usa il client `mc` incluso nell'immagine SILO.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-my-planner-attachments} &&
      exit 0
      "
