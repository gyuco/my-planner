services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
      - "3100:3100"
    environment:
      - DATABASE_URL=file:/data/my-planner.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - PORT=3000
      - MCP_HTTP_PORT=3100
    volumes:
      - ./data:/data
      - ./attachments:/attachments

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server
