name: CI

on:
  push:
  pull_request:

env:
  # DB SQLite effimero, ricreato ad ogni run da `prisma migrate deploy`
  # (vedi README.md, flusso CI/produzione vs dev).
  DATABASE_URL: file:./ci.db
  JWT_SECRET: ci-fake-jwt-secret-not-for-production
  BOOTSTRAP_USERNAME: ci-admin
  BOOTSTRAP_PASSWORD: ci-admin-password

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install

      - name: Prisma generate (apps/server)
        run: npm run --workspace apps/server prisma:generate

      - name: Prisma migrate deploy (apps/server, DB effimero)
        run: npm run --workspace apps/server prisma:migrate:deploy

      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm run test --if-present

      # Predispone Playwright per gli scenari e2e (T4-T9, prossimo batch);
      # nessun test e2e esiste ancora in questo batch, questo step prepara
      # l'ambiente cosi' che il job e2e sotto sia pronto non appena arriveranno.
      - name: Install Playwright browsers
        run: npx --workspace apps/web playwright install --with-deps
        continue-on-error: true

  # Validazione del porting Cloudflare (CF1-CF13) senza deploy: typecheck dei
  # sorgenti Worker e delle Pages Functions, migrazioni D1 su DB locale e
  # bundle del Worker con wrangler.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install

      - name: Prisma generate (apps/server, include client D1)
        run: npm run --workspace apps/server prisma:generate

      - name: Typecheck Worker (Workers types)
        run: npm run --workspace apps/server typecheck:cf

      - name: Typecheck Pages Functions
        run: npx --workspace apps/web tsc -p tsconfig.functions.json

      - name: Applica migrazioni D1 (locale, miniflare)
        run: npm run --workspace apps/server d1:migrate:local

      - name: Bundle Worker (dry-run)
        run: npm run --workspace apps/server cf:dry-run

  # Deploy su Cloudflare (CF15): solo su master, richiede i secrets
  # CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID configurati nel repository.
  # Applica le migrazioni D1 remote, deploya il Worker e il frontend su Pages.
  deploy-cloudflare:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [build-and-test, cloudflare]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Repo variable (Settings -> Variables) con l'URL pubblica del Worker,
      # es. https://my-planner.<subdomain>.workers.dev: serve alla build Pages
      # per la config MCP mostrata in UI (VITE_MCP_HTTP_BASE_URL). Il Worker
      # usa invece il valore MCP_HTTP_BASE_URL in apps/server/wrangler.toml.
      VITE_MCP_HTTP_BASE_URL: ${{ vars.MCP_HTTP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run --workspace apps/server prisma:generate

      - name: Migrazioni D1 (remote)
        run: npm run --workspace apps/server d1:migrate:remote

      - name: Deploy Worker REST + MCP
        run: npm run --workspace apps/server cf:deploy

      - name: Deploy frontend su Cloudflare Pages
        run: npm run --workspace apps/web pages:deploy

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Placeholder per T4-T9: nessun test e2e esiste ancora in apps/web/e2e,
    # quindi il job termina subito senza avviare la stack (server+web+MinIO
    # via docker-compose.yml) finche' gli scenari non vengono aggiunti.
    env:
      # Fa girare anche lo scenario T6/S3 (playwright.config.ts avvia un
      # backend/frontend dedicati con backend "s3" quando E2E_S3=1), usando
      # il MinIO di docker-compose.yml avviato sotto.
      E2E_S3: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check for Playwright e2e tests
        id: check
        run: |
          if [ -d apps/web/e2e ] && [ -n "$(find apps/web/e2e -name '*.spec.ts' 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Avvia MinIO (per lo scenario T6/S3) via docker compose
        # I test Playwright avviano backend/frontend in locale via `webServer`
        # (porte dedicate, vedi playwright.config.ts): non serve buildare/
        # avviare le immagini server/web di docker-compose.yml, solo MinIO
        # (+ minio-init per creare il bucket) e' realmente utilizzato qui.
        if: steps.check.outputs.found == 'true'
        run: docker compose up -d minio minio-init

      - uses: actions/setup-node@v4
        if: steps.check.outputs.found == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm install
        if: steps.check.outputs.found == 'true'

      - name: Install Playwright browsers
        if: steps.check.outputs.found == 'true'
        run: npx --workspace apps/web playwright install --with-deps

      - name: Run Playwright e2e tests
        if: steps.check.outputs.found == 'true'
        run: npm run --workspace apps/web test:e2e

      - name: Stop stack
        if: steps.check.outputs.found == 'true'
        run: docker compose down -v
