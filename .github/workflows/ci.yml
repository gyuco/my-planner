name: CI

on:
  push:
  pull_request:
  # Permette di rilanciare manualmente il workflow (e quindi il deploy) dal
  # tab Actions, utile quando la CI fallisce per cause esterne o per un
  # deploy di emergenza. Il job di deploy resta limitato a `master`.
  workflow_dispatch:

env:
  # DB SQLite effimero, ricreato ad ogni run da `prisma migrate deploy`
  # (vedi README.md, flusso CI/produzione vs dev).
  DATABASE_URL: file:./ci.db
  JWT_SECRET: ci-fake-jwt-secret-not-for-production
  BOOTSTRAP_USERNAME: ci-admin
  BOOTSTRAP_PASSWORD: ci-admin-password

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prisma generate (apps/server)
        run: npm run --workspace apps/server prisma:generate

      - name: Prisma migrate deploy (apps/server, DB effimero)
        run: npm run --workspace apps/server prisma:migrate:deploy

      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm run test --if-present

  # Validazione del porting Cloudflare (CF1-CF13) senza deploy: typecheck dei
  # sorgenti Worker e delle Pages Functions, migrazioni D1 su DB locale e
  # bundle del Worker con wrangler.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prisma generate (apps/server, include client D1)
        run: npm run --workspace apps/server prisma:generate

      - name: Typecheck Worker (Workers types)
        run: npm run --workspace apps/server typecheck:cf

      - name: Typecheck Pages Functions
        run: npx --workspace apps/web tsc -p tsconfig.functions.json

      - name: Applica migrazioni D1 (locale, miniflare)
        run: npm run --workspace apps/server d1:migrate:local

      - name: Bundle Worker (dry-run)
        run: npm run --workspace apps/server cf:dry-run

  # Deploy su Cloudflare (CF15): su push a master o workflow_dispatch da master.
  # Richiede i secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID configurati
  # nel repository. Applica le migrazioni D1 remote, deploya il Worker e il
  # frontend su Pages in produzione.
  deploy-cloudflare:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build-and-test, cloudflare]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Repo variable (Settings -> Variables) con l'URL pubblica del Worker,
      # es. https://my-planner.<subdomain>.workers.dev: serve alla build Pages
      # per la config MCP mostrata in UI (VITE_MCP_HTTP_BASE_URL). Il Worker
      # usa invece il valore MCP_HTTP_BASE_URL in apps/server/wrangler.toml.
      VITE_MCP_HTTP_BASE_URL: ${{ vars.MCP_HTTP_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verifica credenziali Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID devono essere configurati come secrets del repository (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          if [ -z "$VITE_MCP_HTTP_BASE_URL" ]; then
            echo "::warning::La repo variable MCP_HTTP_BASE_URL non è configurata: la UI userà il default <host>:3100 per l'endpoint MCP."
          fi

      - run: npm run --workspace apps/server prisma:generate

      - name: Migrazioni D1 (remote)
        run: npm run --workspace apps/server d1:migrate:remote

      - name: Deploy Worker REST + MCP
        run: npm run --workspace apps/server cf:deploy

      - name: Deploy frontend su Cloudflare Pages (produzione)
        # `pages:deploy` senza `--branch` può creare un preview deployment:
        # per la produzione serve esplicitamente `--branch master`.
        run: npm run --workspace apps/web pages:deploy:prod

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      # Fa girare anche lo scenario T6/S3 (playwright.config.ts avvia un
      # backend/frontend dedicati con backend "s3" quando E2E_S3=1), usando
      # il servizio S3-compatibile di docker-compose.yml avviato sotto.
      E2E_S3: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Check for Playwright e2e tests
        id: check
        run: |
          if [ -d apps/web/e2e ] && [ -n "$(find apps/web/e2e -name '*.spec.ts' 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Avvia storage S3 (Silo, fork drop-in di MinIO)
        # I test Playwright avviano backend/frontend in locale via `webServer`
        # (porte dedicate, vedi playwright.config.ts): non serve buildare/
        # avviare le immagini server/web di docker-compose.yml, solo lo
        # storage S3 (+ init per creare il bucket) è realmente utilizzato qui.
        #
        # Nota: le immagini ufficiali MinIO sono state rimosse da Docker Hub
        # (set 2026) e da quay.io (ott 2026). `pgsty/minio` è il fork SILO,
        # drop-in compatible, con lo stesso binario e la CLI `mc`.
        if: steps.check.outputs.found == 'true'
        run: |
          docker compose up -d minio
          docker compose run --rm minio-init

      - uses: actions/setup-node@v5
        if: steps.check.outputs.found == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.found == 'true'

      # Altrimenti `@prisma/client` non è inizializzato e i backend e2e
      # falliscono all'avvio (vedi anche gli altri job, che lo generano).
      - name: Prisma generate (apps/server)
        if: steps.check.outputs.found == 'true'
        run: npm run --workspace apps/server prisma:generate

      - name: Install Playwright browsers
        if: steps.check.outputs.found == 'true'
        run: npx --workspace apps/web playwright install --with-deps

      - name: Run Playwright e2e tests
        if: steps.check.outputs.found == 'true'
        run: npm run --workspace apps/web test:e2e

      - name: Stop stack
        if: always() && steps.check.outputs.found == 'true'
        run: docker compose down -v
